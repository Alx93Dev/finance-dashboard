<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Finance Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Controla tus ingresos, gastos y presupuestos.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <script>
    // Apply the saved theme before first paint to avoid a light flash in dark mode.
    (function () {
      var theme;
      try { theme = JSON.parse(localStorage.getItem('theme')); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.toggle('dark', theme === 'dark');
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Activa JavaScript para usar Finance Dashboard.</noscript>
</body>
</html>
